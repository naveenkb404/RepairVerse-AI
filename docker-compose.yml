version: '3.8'

services:
  # ── PostgreSQL Database Service ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: repairverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repairversedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: repairverse_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - repairverse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repairversedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend API Service ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repairverse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/repairversedb
      DB_USERNAME: postgres
      DB_PASSWORD: repairverse_secure_password
      JWT_SECRET: repairverse_super_secret_jwt_key_32_bytes_min_length_2026_prod!
      ALLOWED_ORIGINS: http://localhost:3000
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - repairverse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Next.js Frontend Web Service ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repairverse-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    networks:
      - repairverse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  repairverse-network:
    driver: bridge
