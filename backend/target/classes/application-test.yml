# Test profile — uses H2 in-memory database, Flyway disabled for speed
# JWT secret is a safe test-only value, never used in production

spring:
  datasource:
    url: jdbc:h2:mem:repairverse_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: test-jwt-secret-for-unit-tests-only-minimum-32-chars-required
    expiration-ms: 3600000
